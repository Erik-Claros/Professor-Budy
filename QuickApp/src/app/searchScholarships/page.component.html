<div class="page-content">
  <header class="header">
    <h1>Scholarships</h1>
  </header>
  <!-- Interest Picker -->
  <div class="interest-container">
    <!-- Interest Picker with Accordion -->
    <div class="interest-picker">
      <div class="category" *ngFor="let category of categorizedInterests">
        <!-- Accordion Header -->
        <div class="accordion-header" (click)="toggleCategory(category.name)">
          <h3 class="category-title">{{ category.name }}</h3>
          <span class="toggle-icon" [class.expanded]="!isCollapsed(category.name)">
            &#9660;
          </span>
        </div>
        <!-- Accordion Body -->
        <div class="accordion-body" [ngClass]="{'hidden': isCollapsed(category.name)}">
          <div class="interests-list">
            <label *ngFor="let interest of category.interests" 
                   [class.checked]="selectedInterests.includes(interest)">
                   <input 
                   type="checkbox" 
                   [value]="interest" 
                   [checked]="selectedInterests.includes(interest)"
                   (change)="handleInterestChange($event, interest)" 
                 />
                 
              {{ interest }}
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Additional Information -->
    <div class="additional-info">
      <h2>Additional Information</h2>
      <div class="category">
        <div class="input-group">
          <label for="school">School:</label>
          <input 
            id="school" 
            type="text" 
            [(ngModel)]="school" 
            placeholder="Enter your school" 
          />
        </div>
      </div>
    </div>
    
    <div class="submit-container">
      <button (click)="sendInterestData()">Search</button>
    </div>

    <!-- Bot Response -->
    <div class="bot-response">
      <div class="speech-bubble" *ngIf="loading">
        <p>thinking...</p>
      </div>
    </div>

    <!-- Scholarships Display -->
    <div class="scholarship-results" *ngIf="!loading && scholarships.length > 0">
      <h2>Scholarship Opportunities Found</h2>
      <div class="scholarship-cards">
        <div class="scholarship-card" *ngFor="let sch of scholarships">
          <h3>{{ sch.name }}</h3>
          <p><strong>Requirements:</strong> {{ sch.requirements }}</p>
          <p><strong>Deadline:</strong> {{ sch.application_deadline }}</p>
          <p>
            <strong>How to Apply:</strong>
            <a [href]="sch.how_to_apply" target="_blank" rel="noopener">{{ sch.how_to_apply }}</a>
          </p>
          <p><strong>Additional Info:</strong> {{ sch.additional_info }}</p>
        </div>
      </div>
    </div>
    
  </div>
</div>
