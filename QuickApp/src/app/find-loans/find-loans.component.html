<div class="page-content">
    <header class="header">
        <h1>Grants</h1>
      </header>
    <!-- Interest Picker -->
    <div class="interest-container">
      <!-- Interest Picker with Accordion -->
      <div class="interest-picker">
        <div class="category" *ngFor="let category of categorizedGrantInterests">
          <!-- Accordion Header -->
          <div class="accordion-header" (click)="toggleGrantCategory(category.name)">
            <h3 class="category-title">{{ category.name }}</h3>
            <span class="toggle-icon" [class.expanded]="!isCollapsed(category.name)">
              &#9660;
            </span>
          </div>
          <!-- Accordion Body -->
          <div class="accordion-body" [ngClass]="{'hidden': isCollapsed(category.name)}">
            <div class="interests-list">
              <label *ngFor="let interest of category.interests" 
                     [class.checked]="selectedGrantInterests.includes(interest)">
                     <input 
                     type="checkbox" 
                     [value]="interest" 
                     [checked]="selectedGrantInterests.includes(interest)"
                     (change)="handleInterestChange($event, interest)" 
                     />

                   
                {{ interest }}
              </label>
            </div>
          </div>
        </div>
      </div>
  
      <!-- Additional Information -->
      <div class="additional-info">
        <h2>Additional Information</h2>
        <div class="category">
          <div class="input-group">
            <label for="school">School:</label>
            <input 
              id="school" 
              type="text" 
              [(ngModel)]="school" 
              placeholder="Enter your school" 
            />
          </div>
        </div>
      </div>
      
      <div class="submit-container">
        <button (click)="sendInterestData()">Feeling Lucky</button>
      </div>
  
      <!-- Bot Response -->
      <div class="bot-response">
        <div class="speech-bubble" *ngIf="loading">
          <p>thinking...</p>
        </div>
      </div>
  
      <pre class="detailed-response" *ngIf="!loading && premadResponse">{{ premadResponse }}</pre>
      
    </div>
  </div>
